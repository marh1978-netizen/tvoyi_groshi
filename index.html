<style>
  :root{--gold:#e8c46a;--ink:#12081c}
  html{scroll-behavior:smooth}
  body{background:radial-gradient(70% 45% at 50% 0%,#3b1c4a 0%,transparent 70%) no-repeat,var(--ink);background-attachment:fixed;color:#f1e8f0;font-family:'Montserrat',sans-serif;overflow-x:hidden}
  .serif{font-family:'Playfair Display',serif}
  .gold-text{background:linear-gradient(180deg,#fff1c1,#e8c46a 55%,#b88a2e);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* Hero background */
  .hero{position:relative;min-height:78vh;display:grid;place-items:center;text-align:center;padding:5rem 1.25rem;overflow:hidden;isolation:isolate}
  .hero-bg{position:absolute;inset:0;z-index:-1;background:
    radial-gradient(50% 45% at 50% 38%,rgba(232,196,106,.22),transparent 70%),
    radial-gradient(70% 60% at 50% 0%,#60306e 0%,transparent 70%),
    radial-gradient(60% 50% at 50% 110%,#2a0f4d 0%,transparent 70%),var(--ink);background-size:cover;background-position:center}
  .hero-bg.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,3,15,.55),rgba(7,3,15,.9))}
  .photo .float{position:absolute;z-index:0;opacity:.6;animation:drift 9s ease-in-out infinite}
  @keyframes drift{50%{transform:translateY(-22px) rotate(12deg)}}
  .badge{display:inline-block;padding:.4rem 1rem;border:1px solid rgba(232,196,106,.5);border-radius:999px;font-size:.85rem;color:var(--gold);background:rgba(232,196,106,.07);letter-spacing:.02em}

  /* Coins */
  .slot{position:relative;aspect-ratio:1;width:100%;max-width:150px;margin:0 auto;display:grid;place-items:center;perspective:700px}
  .coinface{--edge:0 1px 0 #a47a22,0 2px 0 #8a6416,0 3px 0 #77540f,0 4px 0 #66460c,0 5px 0 #553a09;
    position:relative;isolation:isolate;border-radius:50%;display:grid;place-items:center;
    font-family:'Playfair Display',serif;font-weight:700;color:#8a6416;
    text-shadow:1px 1px 0 rgba(255,246,205,.85),-1px -1px 1px rgba(70,40,0,.55);
    background:repeating-conic-gradient(rgba(50,28,0,.6) 0 1.1deg,transparent 1.1deg 3deg),
      conic-gradient(from 200deg,#6b4710,#f6dc8f,#b88a2e,#fff3c4,#9a6f1c,#e8c46a,#5e3f0b,#f2d27a,#6b4710);
    box-shadow:var(--edge),0 16px 26px rgba(0,0,0,.65)}
  .coinface::before{content:"";position:absolute;inset:8%;z-index:-1;border-radius:50%;
    background:repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 .6px,transparent .6px 2.4px),
      radial-gradient(circle at 32% 26%,#fff6cf 0%,#f3d77f 22%,#d9a93f 52%,#a47720 85%,#8a6416 100%);
    box-shadow:inset 0 3px 5px rgba(255,248,210,.9),inset 0 -5px 9px rgba(70,40,0,.6),0 0 0 1px rgba(90,60,10,.75),0 1px 2px rgba(255,240,180,.55)}
  .coinface::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.7) 49%,transparent 60%);background-size:260% 100%;background-position:160% 0;animation:sweep 5.5s ease-in-out infinite}
  @keyframes sweep{0%,55%{background-position:160% 0}100%{background-position:-60% 0}}
  #coins>div:nth-child(2) .coin::after{animation-delay:-1.4s}
  #coins>div:nth-child(3) .coin::after{animation-delay:-2.8s}
  #coins>div:nth-child(4) .coin::after{animation-delay:-4.1s}
  #coins>div:nth-child(5) .coin::after{animation-delay:-.7s}
  #coins>div:nth-child(6) .coin::after{animation-delay:-3.4s}
  .coin{width:100%;height:100%;border:0;cursor:pointer;font-size:3.4rem;transition:transform .35s,filter .5s,opacity .5s,box-shadow .5s;
    box-shadow:var(--edge),0 16px 26px rgba(0,0,0,.65),0 0 26px rgba(232,196,106,.3)}
  .coin:hover{transform:translateY(-6px) rotate(-6deg);box-shadow:var(--edge),0 22px 30px rgba(0,0,0,.6),0 0 46px 6px rgba(232,196,106,.6)}
  .coin:hover::after{animation-duration:1.6s}
  .coin:focus-visible{outline:3px solid #fff;outline-offset:5px}
  .coin.chosen{animation:flip .9s ease forwards;box-shadow:var(--edge),0 0 60px 14px rgba(255,215,120,.85);cursor:default}
  .coin.dim{filter:grayscale(.7) brightness(.35);opacity:.55;pointer-events:none;transform:scale(.88)}
  @keyframes flip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(540deg) scale(1.22)}100%{transform:rotateY(720deg) scale(1.1)}}
  .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);opacity:0;pointer-events:none}
  .slot.fire .ring{animation:ring 1.4s ease-out forwards}
  .slot.fire .ring:nth-child(2){animation-delay:.2s}
  .slot.fire .ring:nth-child(3){animation-delay:.4s}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
  .coin-name{margin-top:.6rem;text-align:center;font-size:.85rem;color:#c5a5bc;transition:opacity .5s}
  .dim-wrap .coin-name{opacity:.35}
  .glow-coin{width:120px;height:120px;font-size:3.8rem;box-shadow:var(--edge),0 0 70px 16px rgba(255,215,120,.6);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:var(--edge),0 0 100px 28px rgba(255,215,120,.85)}}

  /* Reveal + panels */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1s ease}
  .reveal.show{opacity:1;transform:none}
  .panel{background:linear-gradient(160deg,rgba(96,48,110,.5),rgba(24,10,36,.9));border:1px solid rgba(232,196,106,.35);border-radius:1.25rem;box-shadow:0 0 60px rgba(96,48,110,.35)}
  .btn{display:inline-block;text-align:center;padding:.95rem 1.8rem;border-radius:999px;font-weight:600;transition:transform .25s}
  .btn:hover{transform:translateY(-2px)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .btn-gold{background:linear-gradient(180deg,#f6dc8f,#c99a34);color:#2b1a02;box-shadow:0 0 30px rgba(232,196,106,.35)}
  .btn-line{border:1px solid var(--gold);color:var(--gold)}
  .btn-line:hover{background:rgba(232,196,106,.1)}
  .expert-photo{width:112px;height:112px;border-radius:50%;flex:none;border:2px solid var(--gold);background:#1e1034 center/cover;display:grid;place-items:center;color:#a68ba3;font-size:.75rem;text-align:center}
  .decor{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .sym{position:relative;z-index:1}
  .screen{display:none}
  .screen.active{display:block;animation:scrIn .7s ease}
  .screen.center.active{display:flex;flex-direction:column;justify-content:center;min-height:100vh}
  @keyframes scrIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .solution{text-align:left;line-height:1.8;color:#e5f5ee;background:rgba(16,185,129,.09);border-left:4px solid #10b981;padding:1.1rem 1.2rem;border-radius:0 .75rem .75rem 0}
  .photo{position:relative;width:100%;max-width:100%;margin:0 auto;aspect-ratio:960/1200;overflow:hidden;container-type:inline-size;
    background:#6b3f5a;perspective:700px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 0 60px rgba(96,48,110,.4)}
  @media (min-width:700px){.photo{max-width:min(560px,calc((100svh - 40px)*.8));border-radius:1.75rem;margin-top:1.25rem;border:1px solid rgba(232,196,106,.35)}}
  .photo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
  .hfit{margin-top:.1rem;font-family:'Playfair Display',Georgia,serif;font-weight:800;text-transform:uppercase;color:#fff6e4;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
  .hfit span{display:block;white-space:nowrap;line-height:1.1}
  .hfit .l2{color:#f2c85b}
  .hfit .l1,.hfit .l2{font-size:2rem;font-size:calc(100cqw/8.2)}
  .arrow{display:block;width:max-content;margin:.7rem auto 0;filter:drop-shadow(0 0 10px rgba(255,200,90,.75));animation:arrowb 1.5s ease-in-out infinite}
  @keyframes arrowb{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
  .pick-lead{text-align:left;font-size:1.02rem;line-height:1.55;color:#f1e8f0}
  .hero-sub{max-width:min(560px,calc((100svh - 40px)*.8));margin:.85rem auto 0;padding:0 1rem;text-align:left;font-size:1.02rem;line-height:1.55;font-weight:500;color:#e8c46a}
  .hero-title{container-type:inline-size;max-width:min(560px,calc((100svh - 40px)*.8));margin:0 auto;padding:1rem 1rem 0;text-align:left}
  .photo-ph{position:absolute;top:35%;left:0;right:0;text-align:center;z-index:1;color:#a68ba3;font-size:.9rem}
  .photo.has-photo .photo-ph,.photo.has-photo .float{display:none}
  .cell{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);border-radius:1.25rem;padding:1.1rem .6rem .8rem}
  .btn{cursor:pointer}.btn-gold{border:0}
  .zl{display:block;font:600 .78rem/1 'Montserrat',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#e8c46a;margin-bottom:.7rem}
  .zn{display:block;font-size:1.65rem;line-height:1.2;text-wrap:balance}
  .pain p+p,.solution p+p{margin-top:.85rem}
  .pain{margin-top:1.25rem;text-align:left;line-height:1.75;color:#e5e7eb;background:rgba(239,68,68,.09);border-left:4px solid #ef4444;padding:1rem 1.1rem;border-radius:0 .75rem .75rem 0}
  .prose-b p{margin-top:1rem;line-height:1.75;color:#d1d5db}
  .prose-b strong{color:#f3e3b3}
  .prose-b ul{list-style:none;margin:1.25rem 0}
  .prose-b li{position:relative;padding-left:1.7rem;margin-bottom:.8rem;color:#e5e7eb;line-height:1.65}
  .prose-b li::before{content:"✨";position:absolute;left:0}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
  @media (prefers-reduced-motion:reduce){.hfit span,.hfit span::before,.hfit span::after{animation:none}.arrow{animation:none}.coin,.reveal,.float,.glow-coin{transition:none;animation:none}.coinface::after{animation:none}.coin.chosen{animation:none}.slot.fire .ring{animation:none}}
</style>
</head>

  coins: [
    {sym:"", name:"Монетка 01", title:"Затик «Пакет-з-пакетами»",
     text:"Ти боїшся витратити зайву копійку на себе, бо в голові постійно крутиться: «А раптом завтра апокаліпсис, а я без гречки, макаронів і туалетного паперу?»\n\nКупити нову помаду, хоча для жінки це просто обов'язково, здається тобі злочином проти сімейного бюджету. Гроші в тебе ніби є, але ти їм не рада - тільки тремтиш над ними, як дракон над золотом.",
     antidoteTitle:"",
     antidote:"Введи легальну «амністію для помади». Виділи окрему невелику суму з гордою назвою «На розблокування жіночого щастя». Пообіцяй собі, що апокаліпсис скасовується, гречки в домі і так достатньо, а нова помада - це внесок у твою нервову систему.\n\nКупи помаду першою - до оплати комуналки та інших платежів - і нехай весь світ зачекає!"},
    {sym:"", name:"Монетка 02", title:"Затик «Я все сама і працюю на знос»",
     text:"Ти свято віриш у концепцію «заробляє той, хто працює 24/7». Бігаєш, як навіжена, від світанку до темряви, поки вже не починаєш падати на клавіатуру чи швабру.\n\nА коли твоя внутрішня батарейка сіла і ти просто лежиш на дивані - все, всесвіт вирішує, що ти у відпустці назавжди, і грошовий кран перекривається. Тобто, або ти пашеш без сил, або відпочиваєш...і тоді вітай, пустий гаманцю!",
     antidoteTitle:"",
     antidote:"Перестань гнати себе наглухо. Організуй законний страйк: домовся з собою, що твій мозок і тіло - це не раби на галерах, а елітний курорт.\n\nЗапровадь правило «золотої години»: щодня хоча б 30–60 хвилин ти не робиш абсолютно нічого.\n\nІ побачиш: коли в тебе з'явиться енергія, гроші почнуть приходити значно легше, ніж через сльози та мігрень."},
    {sym:"", name:"Монетка 03", title:"Затик «Мені соромно витрачати на себе»",
     text:"Коли треба купити щось для дому, дитини чи чоловіка - будь-ласка, в тебе гроші завжди знаходяться.\n\nАле варто тобі захотіти собі новий крем, манікюр чи просто каву з круасаном - одразу всередині прокидається внутрішнє міністерство фінансів із пікетом:\n«Ти куди зібралася?\nВ тебе ще комуналка не оплачена!\nЯка кава, ти що, мільйонерка?»\n\nІ ти йдеш додому горда, але зневоднена і без десерту.",
     antidoteTitle:"",
     antidote:"Перехитри своє «внутрішнє міністерство фінансів». Почни кожного місяця закладати витрати на себе у свій звичний бюджет нарівні з комуналкою!\n\nТак і запиши в блокноті: «Комуналка - 5000 грн, Інтернет - 300 грн, Кава з круасаном і новий крем для душі - 1000 грн».\n\nЯкщо це офіційний рядок у твоїх витратах, то мінфін всередині тебе більше не зможе влаштовувати пікети."},
    {sym:"", name:"Монетка 04", title:"Затик «Гроші крізь пальці, або емоційний шопінг»",
     text:"Це коли на душі шкребуть кішки, начальник нагорі розлютився, або ти просто втомилася від усього - і твої руки самі, у містичному трансі, роблять замовлення на сайтах.\n\nВ результаті ти сидиш у завалі коробок, де п'ята кофта кольору «пильна троянда» та десята червона помада, зате стрес ніби знято... правда, разом із зарплатою.\n\nІ ти сидиш така задоволена в моменті.\n\nА пізніше перевіряєш залишок грошей на рахунку й думаєш: «Краще б я просто поплакала безкоштовно».",
     antidoteTitle:"",
     antidote:"Встанови протипожежну паузу на 24 години. Якщо знову тебе почне накривати депресія і руки потягнуться замовити чергову непотрібну річ - зроби по-хитрому: кидай усе в кошик на сайті, потім зачини вкладку і лягай спати.\n\nЯкщо наступного ранку ти всеодно прокинешся з думкою, що без цього твоє життя втратить сенс - купуй.\n\nАле в 90% випадків буває так: ти зранку подивишся на свій вибір з круглими очима і закриєш вкладку до кращих часів."},
    {sym:"", name:"Монетка 05", title:"Затик «Вічна рятувальниця чужих човнів»",
     text:"Ти - ходячий фонд допомоги для всіх навколо. Подрузі терміново треба на нігті, а в тебе зайвих п'ять тисяч, кума плаче, бо затримали зарплату, родичам треба позичити «на тиждень», який триває вже рік.\n\nТи роздаєш свої гроші наліво й направо з широкою душею альтруїстки, а потім сама стоїш в магазині на касі і забираєш останні копійки з кишені, бо в твоєму власному гаманці чомусь стало пусто і він \"пішов у мінус\" - за чужі гріхи.",
     antidoteTitle:"",
     antidote:"Оформи юридичну відпустку з посади «МНС для всіх навколо». Коли чергова подруга, або родичі почнуть плакати в трубку і просити грошей спокійно скажи: «Ой, сонечко, я б із радістю, але в моєму гаманці вже пусто».\n\nДопомагай лише тоді, коли твій власний холодильник забитий смаколиками, а в душі радість та задоволення."},
    {sym:"", name:"Монетка 06", title:"Затик «Страх великих грошей - краще синиця в руках»",
     text:"Тобі кажуть: «Давай зробимо крок уперед, масштабуємося, є шанс заробити втричі більше!» А всередині тебе в цей момент спрацьовує сирена повітряної тривоги: «О ні, великі гроші - великі проблеми, податкова прийде, бандити заберуть, або я просто не справлюся!»\n\nІ ти з таким полегшенням задкуєш у свою затишну фінансову ямку, де хоч і тісно, зате стабільно мало і ніхто не чіпає.",
     antidoteTitle:"",
     antidote:"Подружися зі своєю внутрішньою «сиреною». Коли тобі запропонують підвищення чи більше заробити, а всередині почне верещати сигнал «караул», скажи цьому страху: «Спокійно, я з усім розберуся».\n\nПоділи велику мету чи цифри на зручні маленькі кроки чи частки - дозволь собі звикнути до думки, що більші гроші несуть тобі не проблеми, а свободу та краще життя."}

    transition: ["Поки ти гралася з монетками і розбиралася зі своїми внутрішніми затиками, твоя ситуація вже зрушила з мертвої точки, і в твоїх думках почала вимальовуватися чітка стежка до твого достатку.", "А тепер просто уяви: ти чітко знаєш свою фінансову стратегію на весь 2027 рік. Жодних нічних думок в темряві типу «Як дотягнути до зарплати?», «А раптом я зроблю щось не те і втрачу все?», «Чи варто взагалі пробувати?» чи «Чим я ризикую?». Замість цього ти робиш усвідомлені кроки і відчуваєш спокій і повну впевненість у завтрашньому дні."],

/* ============================================================================ */

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let locked = false;
const C = CONTENT;
const nice = t => t.replace(/ - /g, '\u00a0— ')
  .replace(/(^|\s)(\S{1,2})\s+/g, '$1$2\u00a0')
  .replace(/\S+-\S+/g, m => '<span style="white-space:nowrap">' + m + '</span>');
const fmt = t => t.split(/\n\s*\n/).map(x => '<p>' + x.trim().replace(/\n/g,'<br>') + '</p>').join('');
const DECOR = '<svg class="decor" viewBox="0 0 200 200" aria-hidden="true"><use href="#decor-g"/></svg>';

// Static texts
if(C.hero.bgImage){ $('hero-img').src = C.hero.bgImage; $('hero-bg').classList.add('has-photo'); } else { $('hero-img').remove(); }
$('h-title').innerHTML = C.hero.title;
$('h-sub').textContent = C.hero.sub;
$('p-desc').textContent = C.pick.desc;
$('f-hook').textContent = C.finale.hook;
$('f-expose').innerHTML = C.finale.transition.map(t => `<p>${t}</p>`).join('');
$('pres').innerHTML = C.finale.presentation.map(b => Array.isArray(b) ? `<ul>${b.map(i => `<li>${i}</li>`).join('')}</ul>` : `<p>${b}</p>`).join('');
if(C.finale.photo){ $('e-photo').style.backgroundImage = `url("${C.finale.photo}")`; $('e-photo').textContent = ''; }
$('btn1').textContent = C.finale.btn1; $('btn1').href = C.links.btn1; $('arrow2').href = C.links.btn1;

document.querySelectorAll('.float').forEach(el => el.innerHTML = DECOR);

// Coins
const wrap = $('coins');
C.coins.forEach((c, i) => {
  const cell = document.createElement('div'); cell.className = 'cell';
  cell.innerHTML = `
    <div class="slot">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <button class="coin coinface" aria-label="Відкрити: ${c.name}">${DECOR}</button>
    </div>
    <div class="coin-name">${c.name}</div>`;
  cell.querySelector('.coin').addEventListener('click', e => pick(i, cell, e.currentTarget));
  wrap.appendChild(cell);
});

/* ---------- Coin burst (canvas) ---------- */
const cv = $('fx'), ctx = cv.getContext('2d');
let parts = [], raf = null;
function fit(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
fit(); addEventListener('resize', fit);

function burst(x, y){
  const n = reduce ? 10 : 56;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 4 + Math.random()*9;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:8+Math.random()*12,spin:Math.random()*6,ws:.15+Math.random()*.3,life:1,decay:.006+Math.random()*.008,type:'coin'});
  }
  if(!reduce) for(let i=0;i<50;i++){
    const a = Math.random()*Math.PI*2, s = 2 + Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*2.5,life:1,decay:.014+Math.random()*.02,type:'spark'});
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  for(const p of parts){
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    ctx.save(); ctx.globalAlpha = Math.max(p.life,0);
    if(p.type==='coin'){
      p.vy += .32; p.vx *= .99; p.spin += p.ws;
      ctx.translate(p.x,p.y); ctx.scale(Math.max(Math.abs(Math.cos(p.spin)),.12),1);
      const r = p.r, sx = Math.cos(p.spin);
      ctx.fillStyle = '#6b4710'; ctx.beginPath(); ctx.arc(0,r*.14,r,0,Math.PI*2); ctx.fill();
      const rim = ctx.createLinearGradient(-r,-r,r,r);
      rim.addColorStop(0,'#fff3c4'); rim.addColorStop(.35,'#d9a93f'); rim.addColorStop(.6,'#f6dc8f'); rim.addColorStop(1,'#7a5513');
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle = rim; ctx.fill();
      ctx.strokeStyle = '#5e3f0b'; ctx.lineWidth = 1; ctx.stroke();
      const g = ctx.createRadialGradient(-r*.3,-r*.35,1,0,0,r*.84);
      g.addColorStop(0,'#fff6cf'); g.addColorStop(.4,'#f0cd6a'); g.addColorStop(1,'#b8872a');
      ctx.beginPath(); ctx.arc(0,0,r*.84,0,Math.PI*2); ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'rgba(110,75,15,.6)'; ctx.beginPath(); ctx.arc(0,0,r*.62,0,Math.PI*2); ctx.stroke();
      if(sx > 0 && r > 11){ ctx.fillStyle='rgba(122,85,19,.75)'; ctx.font='700 '+(r*.95)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',0,r*.05); }
      if(Math.abs(sx) < .25){ ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fillRect(-1,-r,2,r*2); }
    } else {
      p.vx *= .96; p.vy *= .96; ctx.shadowColor='#ffd978'; ctx.shadowBlur=10;
      ctx.fillStyle='#fff1c1'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : null;
  if(!parts.length) ctx.clearRect(0,0,innerWidth,innerHeight);
}

/* ---------- Sound ---------- */
function playCoinSound(){
  try{
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [987.77,1318.51,1567.98,2093].forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*.04;
      o.type = 'sine'; o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.0001,t+.25);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.25);
    });
  }catch(e){}
}

/* ---------- Screens ---------- */
const SCREENS = ['s1','s2','s3','s4'];
function go(id){
  SCREENS.forEach(x => $(x).classList.toggle('active', x === id));
  window.scrollTo({top:0, behavior:'auto'});
}

/* ---------- Pick ---------- */
function pick(i, cell, coin){
  if(locked) return; locked = true;
  const d = C.coins[i];
  playCoinSound();
  const rect = coin.getBoundingClientRect();
  burst(rect.left + rect.width/2, rect.top + rect.height/2);
  cell.querySelector('.slot').classList.add('fire');
  coin.classList.add('chosen');
  [...wrap.children].forEach(c => { if(c !== cell){ c.classList.add('dim-wrap'); c.querySelector('.coin').classList.add('dim'); } });

  $('r-coin').innerHTML = DECOR;
  const nm = d.title.replace(/^Затик\s+/, '');
  $('r-title').innerHTML = '<span class="zl">Затик</span><span class="zn">' + nice(nm) + '</span>';
  $('r-text').innerHTML = fmt(d.text);
  $('a-text').innerHTML = fmt(d.antidote);
  setTimeout(() => go('s2'), reduce ? 0 : 1700);
}
$('next1').addEventListener('click', () => go('s3'));
$('next2').addEventListener('click', () => go('s4'));

/* ---------- Reset ---------- */
function resetAll(){
  [...wrap.children].forEach(c => {
    c.classList.remove('dim-wrap'); c.querySelector('.slot').classList.remove('fire');
    c.querySelector('.coin').classList.remove('dim','chosen');
  });
  locked = false;
  go('s1');
  $('pick').scrollIntoView({behavior:'auto'});
}
$('again').addEventListener('click', resetAll);
</script>
